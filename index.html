<style>
:root{--red:#c8102e;--mar:#6b0f1a;--gold:#c9a24a;--bg:#fff;--soft:#fdf2f2;--card:#fff;--txt:#2b1214;--mut:#7a5a5d;--line:#f0d9d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0b0d;--soft:#2a1013;--card:#26100f;--txt:#fff0ec;--mut:#d3a9a9;--line:#4a2025}}
:root[data-theme="dark"]{--bg:#1a0b0d;--soft:#2a1013;--card:#26100f;--txt:#fff0ec;--mut:#d3a9a9;--line:#4a2025}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bd{height:8px;background:repeating-linear-gradient(90deg,var(--red) 0 16px,var(--gold) 16px 20px,var(--mar) 20px 36px,var(--gold) 36px 40px,#fff 40px 52px,var(--gold) 52px 56px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1150px;margin:auto;padding:.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{font:900 1.7rem 'Playfair Display',serif;color:var(--red);line-height:1}.logo small{display:block;font:500 .65rem Poppins;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-top:3px}
nav{display:flex;gap:1.3rem;align-items:center;flex-wrap:wrap}nav a{font-weight:500;position:relative}nav a:hover{color:var(--red)}
.cartb{background:var(--red);color:#fff;padding:.45rem 1rem;border-radius:99px;font-weight:600}.cartb:hover{background:var(--mar)!important;color:#fff!important}
main{max-width:1150px;margin:auto;padding:1.5rem 1.1rem 4rem;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:'Playfair Display',serif;margin:.2rem 0 .6rem}h2{font-size:clamp(1.7rem,4vw,2.3rem);color:var(--mar)}
@media(prefers-color-scheme:dark){h2{color:#ffb4b4}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;align-items:center;background:linear-gradient(135deg,var(--soft),var(--bg));border:1px solid var(--line);border-radius:28px;padding:2.2rem;margin-bottom:3rem}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);color:var(--red);line-height:1.05}.hero p{color:var(--mut);font-size:1.05rem;max-width:480px}
.hero img{width:100%;max-width:340px;justify-self:center;border-radius:22px;box-shadow:0 20px 50px rgba(107,15,26,.35);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.btn{display:inline-block;border:2px solid var(--red);background:var(--red);color:#fff;font:600 .95rem Poppins;padding:.8rem 1.5rem;border-radius:99px;cursor:pointer;transition:.25s;margin:.25rem .4rem .25rem 0}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(200,16,46,.35)}.btn.o{background:transparent;color:var(--red)}.btn.o:hover{background:var(--red);color:#fff}
.btn.g{background:#1f9d55;border-color:#1f9d55}.btn.k{background:var(--gold);border-color:var(--gold);color:#2b1214}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.2rem;transition:.3s;box-shadow:0 4px 14px rgba(107,15,26,.08)}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 36px rgba(200,16,46,.2)}
.pimg{background:var(--soft);border-radius:16px;display:flex;justify-content:center;padding:1rem;height:280px}.pimg img,.pimg svg{height:100%;width:auto;object-fit:contain}
.price{font:700 1.4rem Poppins;color:var(--red)}.mut{color:var(--mut);font-size:.9rem}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--gold);color:var(--mar);font-size:.75rem;padding:.2rem .65rem;border-radius:99px;margin:.15rem .15rem 0 0;font-weight:500}
@media(prefers-color-scheme:dark){.tag{color:var(--gold)}}
.feat{text-align:center}.feat .i{font-size:2rem}
.det{display:grid;grid-template-columns:1fr 1fr;gap:2rem}.det .pimg{height:440px}
table{width:100%;border-collapse:collapse}td,th{padding:.7rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.q{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;overflow:hidden}.q button{border:0;background:var(--soft);width:34px;height:34px;font-size:1.1rem;cursor:pointer;color:var(--txt)}.q b{min-width:34px;text-align:center}
input,select,textarea{width:100%;padding:.75rem .9rem;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--txt);margin:.25rem 0 .8rem}
label{font-weight:500;font-size:.88rem}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 1rem}
.sum{background:var(--soft);border-radius:18px;padding:1.2rem}.sum div{display:flex;justify-content:space-between;padding:.3rem 0}.sum .t{font-weight:700;font-size:1.2rem;border-top:2px dashed var(--gold);margin-top:.4rem;padding-top:.6rem;color:var(--red)}
.pay{display:flex;gap:.7rem;flex-wrap:wrap;margin:.4rem 0 1rem}.pay label{flex:1;min-width:200px;border:2px solid var(--line);border-radius:14px;padding:.8rem;cursor:pointer;display:block}.pay input{width:auto;margin:0 .4rem 0 0}.pay label:has(input:checked){border-color:var(--red);background:var(--soft)}
.wa{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;font-size:1.7rem;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:30;animation:pu 2.2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}70%{box-shadow:0 0 0 16px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
footer{background:var(--mar);color:#ffe9d2;text-align:center;padding:2rem 1rem 5rem}footer a{color:var(--gold)}
.sc{overflow-x:auto}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--mar);color:#fff;padding:.7rem 1.2rem;border-radius:99px;z-index:50;animation:in .3s}
@media(max-width:760px){.hero,.det{grid-template-columns:1fr}.hero{padding:1.4rem}.det .pimg{height:340px}.bar{justify-content:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

cart:function(){if(!cart.length)return '<h2>Your Cart</h2><p>Your cart is empty.</p><a class="btn" href="#/shop">Browse products</a>';return '<h2>Your Cart</h2><div class="sc"><table>'+cart.map(function(c){var p=P(c.id);return '<tr><td style="width:70px"><div class="pimg" style="height:70px;padding:4px">'+pim(p)+'</div></td><td><b>'+esc(p.name)+'</b><div class="mut">'+inr(p.price)+' · '+esc(p.wt)+'</div></td><td><span class="q"><button onclick="qty(\''+c.id+'\',-1)">−</button><b>'+c.q+'</b><button onclick="qty(\''+c.id+'\',1)">+</button></span></td><td><b>'+inr(c.q*p.price)+'</b></td></tr>'}).join('')+'</table></div><div class="sum" style="margin-top:1rem"><div><span>Subtotal</span><span>'+inr(sub())+'</span></div><div class="mut"><span>Delivery</span><span>calculated at checkout</span></div></div><p><a class="btn o" href="#/shop">Continue shopping</a><a class="btn" href="#/checkout">Checkout</a></p>'},
checkout:function(){if(!cart.length)return V.cart();return '<h2>Checkout</h2><div class="det" style="align-items:start"><div><div class="two"><div><label>Full name</label><input id="cn" autocomplete="name"></div><div><label>Phone number</label><input id="cp" inputmode="numeric" maxlength="10" autocomplete="tel"></div></div><label>Delivery address</label><textarea id="ca" rows="3" autocomplete="street-address"></textarea><div class="two"><div><label>City / Town</label><input id="cx"></div><div><label>PIN code</label><input id="cz" inputmode="numeric" maxlength="6" oninput="tot()"></div></div><label>Payment method</label><div class="pay"><label><input type="radio" name="pm" value="UPI" checked onchange="tot()"> UPI (GPay / PhonePe / Paytm)</label>'+(S.cod?'<label><input type="radio" name="pm" value="COD" onchange="tot()"> Cash on Delivery</label>':'')+'</div></div><div class="sum"><h3>Order summary</h3>'+cart.map(function(c){return '<div><span>'+esc(P(c.id).name)+' × '+c.q+'</span><span>'+inr(c.q*P(c.id).price)+'</span></div>'}).join('')+'<div><span>Subtotal</span><span>'+inr(sub())+'</span></div><div><span>Delivery</span><span id="sd">Enter PIN</span></div><div class="t"><span>Total</span><span id="st">'+inr(sub())+'</span></div><button class="btn" style="width:100%;margin-top:1rem" onclick="place()">Place Order</button><p class="mut" style="font-size:.8rem">Your order is sent to Ama\'s Bite on WhatsApp for confirmation.</p></div></div>'},
success:function(id){var o=orders.filter(function(x){return x.id==id})[0];if(!o)return V.home();return '<div class="card" style="text-align:center;max-width:620px;margin:auto"><div style="font-size:3rem">🎉</div><h2>Thank you, '+esc(o.name)+'!</h2><p>Order <b>'+o.id+'</b> · Total <b>'+inr(o.total)+'</b> · '+(o.pm=='COD'?'Cash on Delivery':'UPI')+'</p><p class="mut">Tap below to send your order to Ama\'s Bite on WhatsApp. We will confirm it shortly.</p><a class="btn g" target="_blank" rel="noopener" href="'+wal(o)+'">Send order on WhatsApp</a>'+(o.pm=='UPI'?'<h3 style="margin-top:1.5rem">Pay '+inr(o.total)+' by UPI</h3><div id="qr" style="display:inline-block;background:#fff;padding:10px;border-radius:12px"></div><p><a class="btn k" href="'+upl(o)+'">Pay in UPI app</a></p><p class="mut">UPI ID: <b>'+UPI+'</b><br>After paying, send the payment screenshot on WhatsApp so we can mark it Paid.</p>':'')+'<p><a class="btn o" href="#/">Back to home</a></p></div>'},
about:function(){return '<h2>Our Story</h2><div class="card"><p>Ama\'s Bite makes small-batch chilli condiments at home in Ladakh. Every jar is made the way Ama made it: real red chilli, garlic and soy, with no artificial preservatives or unhealthy additives.</p><p class="mut">FSSAI Lic. No: 22725710000095</p></div>'},
contact:function(){return '<h2>Contact</h2><div class="card"><p>💬 WhatsApp: <a href="https://wa.me/'+WA+'" target="_blank" rel="noopener"><b>+91 88266 79263</b></a></p><p>📞 +91 86124831</p><p>✉️ <a href="mailto:rigzenmutup937@gmail.com">rigzenmutup937@gmail.com</a></p><p>📸 <a href="https://instagram.com/amaschilli_" target="_blank" rel="noopener">@amaschilli_</a></p></div>'},
admin:function(){if(!window._ok)return '<h2>Owner Login</h2><div class="card" style="max-width:360px"><label>Admin PIN</label><input id="ap" type="password"><button class="btn" onclick="if($(\'ap\').value==S.pin){_ok=1;route()}else toast(\'Wrong PIN\')">Login</button></div>';
var st=['New','Confirmed','Packed','Shipped','Delivered','Cancelled'],ps=['Pending','Paid','COD'];
return '<h2>Owner Dashboard</h2><h3>Orders (placed on this device)</h3>'+(orders.length?'<div class="sc"><table>'+orders.map(function(o,i){return '<tr><td><b>'+o.id+'</b><div class="mut">'+esc(o.date)+'</div></td><td>'+esc(o.name)+'<br><span class="mut">'+esc(o.phone)+', '+esc(o.addr)+', '+esc(o.city)+' '+esc(o.pin)+'</span></td><td>'+o.items.map(function(x){return esc(x)}).join('<br>')+'<br><b>'+inr(o.total)+'</b> ('+o.pm+')</td><td><select onchange="orders['+i+'].status=this.value;sv(\'ab_o\',orders)">'+st.map(function(s){return '<option'+(s==o.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select><select onchange="orders['+i+'].paid=this.value;sv(\'ab_o\',orders)">'+ps.map(function(s){return '<option'+(s==o.paid?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td></tr>'}).join('')+'</table></div>':'<p class="mut">No orders yet. New orders also arrive on your WhatsApp.</p>')+'<h3 style="margin-top:2rem">Products &amp; prices</h3>'+S.products.map(function(p,i){return '<div class="card" style="margin-bottom:1rem"><b>'+esc(p.name)+'</b><div class="two"><div><label>Name</label><input data-k="name" data-i="'+i+'" value="'+esc(p.name)+'"></div><div><label>Price (₹)</label><input data-k="price" data-i="'+i+'" value="'+p.price+'"></div><div><label>Net weight</label><input data-k="wt" data-i="'+i+'" value="'+esc(p.wt)+'"></div><div><label>Ingredients</label><input data-k="ing" data-i="'+i+'" value="'+esc(p.ing)+'"></div></div><label>Storage</label><input data-k="st" data-i="'+i+'" value="'+esc(p.st)+'"><label>Description</label><textarea data-k="desc" data-i="'+i+'">'+esc(p.desc)+'</textarea></div>'}).join('')+'<h3>Delivery &amp; payment</h3><div class="card"><label>Delivery zones, one per line: Name|PIN prefixes (comma separated)|Charge. Leave prefixes empty for "everywhere else".</label><textarea id="az" rows="4">'+esc(S.zones)+'</textarea><div class="two"><div><label>Free delivery above (₹, 0 = never)</label><input id="af" value="'+S.free+'"></div><div><label>Cash on Delivery</label><select id="ac"><option value="1"'+(S.cod?' selected':'')+'>Enabled</option><option value="0"'+(S.cod?'':' selected')+'>Disabled</option></select></div><div><label>Admin PIN</label><input id="ax" value="'+esc(S.pin)+'"></div></div></div><p><button class="btn" onclick="saveAdmin()">Save changes</button></p><p class="mut">Settings and orders are saved in this browser only, so manage the shop from one device.</p>'}};
function saveAdmin(){document.querySelectorAll('[data-k]').forEach(function(e){var p=S.products[+e.dataset.i];p[e.dataset.k]=e.dataset.k=='price'?(+e.value||0):e.value});S.zones=$('az').value;S.free=+$('af').value||0;S.cod=$('ac').value=='1';S.pin=$('ax').value||'1234';sv('ab_s',S);toast('Saved ✓')}
function tot(){var z=$('cz').value,s=ship(z),pm=document.querySelector('[name=pm]:checked').value;$('sd').textContent=s==null?'Enter PIN':(s?inr(s):'FREE');$('st').textContent=inr(sub()+(s||0))}
function wal(o){var m="*New order "+o.id+" – Ama's Bite*\n"+o.items.join("\n")+"\nDelivery: "+inr(o.ship)+"\n*Total: "+inr(o.total)+"*\nPayment: "+(o.pm=='COD'?'Cash on Delivery':'UPI (will pay '+inr(o.total)+')')+"\n\nName: "+o.name+"\nPhone: "+o.phone+"\nAddress: "+o.addr+", "+o.city+" - "+o.pin;return 'https://wa.me/'+WA+'?text='+encodeURIComponent(m)}
function upl(o){return 'upi://pay?pa='+UPI+'&pn='+encodeURIComponent("Ama's Bite")+'&am='+o.total+'&cu=INR&tn='+o.id}
function place(){var n=$('cn').value.trim(),ph=$('cp').value.trim(),a=$('ca').value.trim(),c=$('cx').value.trim(),z=$('cz').value.trim();
if(!n||!/^\d{10}$/.test(ph)||!a||!c||!/^\d{6}$/.test(z)){toast('Please fill name, 10-digit phone, address, city and 6-digit PIN');return}
var s=ship(z),pm=document.querySelector('[name=pm]:checked').value,id='AB'+Date.now().toString().slice(-6);
var o={id:id,date:new Date().toLocaleString(),name:n,phone:ph,addr:a,city:c,pin:z,pm:pm,ship:s,total:sub()+s,items:cart.map(function(x){return P(x.id).name+' × '+x.q+' = '+inr(x.q*P(x.id).price)}),status:'New',paid:pm=='COD'?'COD':'Pending'};
orders.unshift(o);sv('ab_o',orders);cart=[];sync();location.hash='#/success/'+id}
function route(){var h=(location.hash||'#/').slice(2).split('/'),k=h[0]||'home',a=V[k]?k:'home';$('app').innerHTML=V[a](h[1]);$('app').style.animation='none';$('app').offsetWidth;$('app').style.animation='';scrollTo(0,0);
if(a=='success'&&$('qr')){var o=orders.filter(function(x){return x.id==h[1]})[0];try{new QRCode($('qr'),{text:upl(o),width:170,height:170})}catch(e){}}}
$('yr').textContent=new Date().getFullYear();$('wab').href='https://wa.me/'+WA+'?text='+encodeURIComponent("Hi Ama's Bite, I'd like to order.");
addEventListener('hashchange',route);sync();route();
</script></body></html>
